name: Deploy Staging Backend to Azure Container Apps

on:
  push:
    branches:
      - develop

env:
  REGISTRY_NAME: lumintraacr # Replace with your exact ACR name if different
  CONTAINER_APP_NAME: lumintra-backend-staging
  RESOURCE_GROUP: lumintra

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # 1. Spin up temporary databases so Spring Boot Integration Tests can execute
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testadmin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: lumintratest
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Unit and Integration Tests
        run: |
          chmod +x mvnw
          ./mvnw clean verify
        env:
          # Point Spring Boot to the temporary GitHub Actions service containers
          DEV_DB_URL: jdbc:postgresql://localhost:5432/lumintratest
          DEV_DB_USERNAME: testadmin
          DEV_DB_PASSWORD: testpassword
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # Dummy values for required placeholders during testing
          JWT_SECRET: test-secret-key-that-is-at-least-32-bytes-long-for-hmac
          GOOGLE_CLIENT_ID: test-google-client-id
          RESEND_API_KEY: re_test_key
          ADMIN_EMAIL: admin@lumintra.test
          ADMIN_PASSWORD: Password123!
          TEST_CUSTOMER_EMAIL: customer@lumintra.test
          TEST_CUSTOMER_PASSWORD: Password123!
          TEST_MANAGER_EMAIL: manager@lumintra.test
          TEST_MANAGER_PASSWORD: Password123!
          TEST_STAFF_EMAIL: staff@lumintra.test
          TEST_STAFF_PASSWORD: Password123!
          TEST_DESIGNER_EMAIL: designer@lumintra.test
          TEST_DESIGNER_PASSWORD: Password123!

  deploy-to-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker image to ACR
        run: |
          docker login ${{ env.REGISTRY_NAME }}.azurecr.io -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }}
          docker build -t ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }} .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: lumintra-env

          registryUrl: ${{ env.REGISTRY_NAME }}.azurecr.io
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}

          environmentVariables: |
            SPRING_PROFILES_ACTIVE=dev
            DEV_DB_URL=${{ secrets.DB_URL }}
            DEV_DB_USERNAME=${{ secrets.DB_USERNAME }}
            DEV_DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            TEST_CUSTOMER_EMAIL=${{ secrets.TEST_CUSTOMER_EMAIL }}
            TEST_CUSTOMER_PASSWORD=${{ secrets.TEST_CUSTOMER_PASSWORD }}
            TEST_MANAGER_EMAIL=${{ secrets.TEST_MANAGER_EMAIL }}
            TEST_MANAGER_PASSWORD=${{ secrets.TEST_MANAGER_PASSWORD }}
            TEST_STAFF_EMAIL=${{ secrets.TEST_STAFF_EMAIL }}
            TEST_STAFF_PASSWORD=${{ secrets.TEST_STAFF_PASSWORD }}
            TEST_DESIGNER_EMAIL=${{ secrets.TEST_DESIGNER_EMAIL }}
            TEST_DESIGNER_PASSWORD=${{ secrets.TEST_DESIGNER_PASSWORD }}