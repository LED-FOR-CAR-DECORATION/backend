# Database
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.com.lumintra.backend=INFO
logging.level.io.lettuce.core.protocol.ConnectionWatchdog=ERROR

# CORS (update when domain is bought or app deployed)
app.cors.allowed-origins=tba
app.cors.allowed-origin-patterns=
