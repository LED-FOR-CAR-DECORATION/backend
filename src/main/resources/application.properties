spring.application.name=backend
spring.profiles.default=dev

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2629800000

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
spring.output.ansi.enabled=DETECT
logging.pattern.console="%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%p]) %clr([traceId=%X{traceId:-none}]){cyan} %clr(%-40.40logger{0}){blue} %m%n"
logging.pattern.file="%d{yyyy-MM-dd HH:mm:ss} [%p] [traceId=%X{traceId:-none}] %-40.40logger{0} %m%n"

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.enable-statistics=true
spring.data.redis.timeout=2s

# Actuator
management.endpoints.web.exposure.include=*
management.health.redis.enabled=true
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.git.mode=full
info.build.enabled=true
info.app.name="Lumintra Backend Service"
info.app.description="Core API for SEP490 project"
info.app.environment=${spring.profiles.active:default}


# Google SSO
google.client.id=${GOOGLE_CLIENT_ID}

# Flyway: an existing schema must be explicitly baselined once at V1.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

# Resend API
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:noreply@lumintra.shop}

# Data seeding
app.seed.admin-email=${ADMIN_EMAIL}
app.seed.admin-password=${ADMIN_PASSWORD}

app.seed.test-customer-email=${TEST_CUSTOMER_EMAIL}
app.seed.test-customer-password=${TEST_CUSTOMER_PASSWORD}

app.seed.test-manager-email=${TEST_MANAGER_EMAIL}
app.seed.test-manager-password=${TEST_MANAGER_PASSWORD}

app.seed.test-staff-email=${TEST_STAFF_EMAIL}
app.seed.test-staff-password=${TEST_STAFF_PASSWORD}

app.seed.test-designer-email=${TEST_DESIGNER_EMAIL}
app.seed.test-designer-password=${TEST_DESIGNER_PASSWORD}
