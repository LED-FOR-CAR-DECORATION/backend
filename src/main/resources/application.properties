spring.application.name=backend
spring.profiles.default=dev

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2629800000

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
spring.output.ansi.enabled=DETECT
logging.pattern.console="%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%p]) %clr([traceId=%X{traceId:-none}]){cyan} %clr(%-40.40logger{0}){blue} %m%n"
logging.pattern.file="%d{yyyy-MM-dd HH:mm:ss} [%p] [traceId=%X{traceId:-none}] %-40.40logger{0} %m%n"

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.enable-statistics=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,metrics
management.health.redis.enabled=true
management.endpoint.health.show-details=always

# Google SSO
google.client.id=${GOOGLE_CLIENT_ID}

# Resend API
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:noreply@lumintra.shop}
