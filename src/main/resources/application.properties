spring.application.name=backend
spring.profiles.default=dev

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2629800000

# QR Secret for individual device QR scanning
app.device.factory-qr-secret=${FACTORY_QR_SECRET:placeholder}


# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
spring.output.ansi.enabled=DETECT
logging.pattern.console="%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%p]) %clr([traceId=%X{traceId:-none}]){cyan} %clr(%-40.40logger{0}){blue} %m%n"
logging.pattern.file="%d{yyyy-MM-dd HH:mm:ss} [%p] [traceId=%X{traceId:-none}] %-40.40logger{0} %m%n"

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.enable-statistics=true
spring.data.redis.timeout=2s

# Actuator
management.endpoints.web.exposure.include=*
management.health.redis.enabled=true
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.git.mode=full
info.build.enabled=true
info.app.name="Lumintra Backend Service"
info.app.description="Core API for SEP490 project"
info.app.environment=${spring.profiles.active:default}


# Google SSO
google.client.id=${GOOGLE_CLIENT_ID}

# Resend API
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:noreply@lumintra.shop}

# SePay VietQR
app.sepay.qr-base-url=${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
app.sepay.bank-name=${SEPAY_BANK_NAME:MBBank}
app.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:0123456789}
app.sepay.account-name=${SEPAY_ACCOUNT_NAME:LUMINTRA}
app.sepay.payment-prefix=${SEPAY_PAYMENT_PREFIX:LMT}
app.sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
app.payment.expiration-check-interval-ms=${PAYMENT_EXPIRATION_CHECK_INTERVAL_MS:60000}

# AhaMove v3 Partner Integration
app.ahamove.base-url=${AHAMOVE_BASE_URL:https://partner-apistg.ahamove.com/v3}
app.ahamove.api-key=${AHAMOVE_API_KEY:}
app.ahamove.mobile=${AHAMOVE_MOBILE:}
app.ahamove.payment-method=${AHAMOVE_PAYMENT_METHOD:BALANCE}
app.ahamove.pickup.name=${AHAMOVE_PICKUP_NAME:Lumintra Warehouse}
app.ahamove.pickup.mobile=${AHAMOVE_PICKUP_MOBILE:}
app.ahamove.pickup.address=${AHAMOVE_PICKUP_ADDRESS:}
app.ahamove.pickup.lat=${AHAMOVE_PICKUP_LAT:}
app.ahamove.pickup.lng=${AHAMOVE_PICKUP_LNG:}
app.ahamove.webhook.require-auth=${AHAMOVE_WEBHOOK_REQUIRE_AUTH:true}
app.ahamove.webhook.header-name=${AHAMOVE_WEBHOOK_HEADER_NAME:X-Api-Key}
app.ahamove.webhook.token=${AHAMOVE_WEBHOOK_TOKEN:}

# Data seeding
app.seed.admin-email=${ADMIN_EMAIL}
app.seed.admin-password=${ADMIN_PASSWORD}

app.seed.test-customer-email=${TEST_CUSTOMER_EMAIL}
app.seed.test-customer-password=${TEST_CUSTOMER_PASSWORD}

app.seed.test-manager-email=${TEST_MANAGER_EMAIL}
app.seed.test-manager-password=${TEST_MANAGER_PASSWORD}

app.seed.test-staff-email=${TEST_STAFF_EMAIL}
app.seed.test-staff-password=${TEST_STAFF_PASSWORD}

app.seed.test-designer-email=${TEST_DESIGNER_EMAIL}
app.seed.test-designer-password=${TEST_DESIGNER_PASSWORD}